<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Téléchargement</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: monospace;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .downloads-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .download-item {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .download-item:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .download-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .download-filename {
            font-weight: 600;
            color: #333;
            font-size: 14px;
            word-break: break-all;
        }

        .download-status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-downloading {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-finished {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status-error {
            background: #ffebee;
            color: #d32f2f;
        }

        .download-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #666;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-weight: 600;
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .error-message {
            background: #ffebee;
            color: #d32f2f;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 13px;
        }

        .success-message {
            background: #e8f5e9;
            color: #388e3c;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 13px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .downloading {
            animation: pulse 2s infinite;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📥 Gestionnaire de Téléchargement</h1>

        <form id="downloadForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="apiUrl">URL de l'API</label>
                    <input type="text" id="apiUrl" value="http://localhost:8000" placeholder="http://localhost:8000">
                </div>
                <div class="form-group">
                    <label for="pollInterval">Intervalle de polling (secondes)</label>
                    <input type="number" id="pollInterval" value="3" min="1" max="60">
                </div>
            </div>

            <div class="form-group">
                <label for="typeDl">Type de média</label>
                <select id="typeDl">
                    <option value="animes">Animes</option>
                    <option value="films">Films</option>
                    <option value="series">Séries</option>
                </select>
            </div>

            <div class="form-group">
                <label for="urls">URLs de téléchargement (une par ligne)</label>
                <textarea id="urls" placeholder="https://1fichier.com/?...&#10;https://1fichier.com/?..."></textarea>
            </div>

            <button type="submit" id="submitBtn">🚀 Lancer le téléchargement</button>

            <div id="formMessage"></div>
        </form>
    </div>

    <div class="downloads-section">
        <h2 style="margin-bottom: 20px; color: #333;">Téléchargements en cours</h2>
        <div id="downloadsList">
            <div class="empty-state">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path>
                </svg>
                <p>Aucun téléchargement en cours</p>
            </div>
        </div>
    </div>
</div>

<script>
    const downloads = {};
    let pollIntervals = {};

    const formatBytes = (bytes) => {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
    };

    const formatSpeed = (bytesPerSecond) => {
        return formatBytes(bytesPerSecond) + '/s';
    };

    const formatTime = (seconds) => {
        if (!seconds || seconds === Infinity) return 'Calcul...';
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) return `${h}h ${m}m ${s}s`;
        if (m > 0) return `${m}m ${s}s`;
        return `${s}s`;
    };

    const showMessage = (message, isError = false) => {
        const msgDiv = document.getElementById('formMessage');
        msgDiv.className = isError ? 'error-message' : 'success-message';
        msgDiv.textContent = message;
        setTimeout(() => msgDiv.textContent = '', 5000);
    };

    const updateDownloadUI = (uuid, data) => {
        const container = document.getElementById('downloadsList');
        const emptyState = container.querySelector('.empty-state');
        if (emptyState) emptyState.remove();

        let item = document.getElementById(`download-${uuid}`);
        if (!item) {
            item = document.createElement('div');
            item.id = `download-${uuid}`;
            item.className = 'download-item';
            container.appendChild(item);
        }

        const info = data.info;
        const progress = info.total_size > 0 ? (info.downloaded_size / info.total_size * 100) : 0;
        const remainingBytes = info.total_size - info.downloaded_size;
        const eta = info.download_speed > 0 ? remainingBytes / info.download_speed : 0;

        let statusClass = 'status-downloading';
        let statusText = 'Téléchargement';

        if (info.finished) {
            statusClass = 'status-finished';
            statusText = 'Terminé';
        } else if (data.status === 'error') {
            statusClass = 'status-error';
            statusText = 'Erreur';
        }

        item.innerHTML = `
                <div class="download-header">
                    <div class="download-filename">${info.filename || 'En attente...'}</div>
                    <div class="download-status ${statusClass}">${statusText}</div>
                </div>

                <div class="download-info">
                    <div class="info-item">
                        <span class="info-label">Type</span>
                        <span>${info.type_dl}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Taille</span>
                        <span>${formatBytes(info.downloaded_size)} / ${formatBytes(info.total_size)}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Vitesse</span>
                        <span>${formatSpeed(info.download_speed)}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Temps restant</span>
                        <span>${formatTime(eta)}</span>
                    </div>
                </div>

                <div class="progress-bar ${info.finished ? '' : 'downloading'}">
                    <div class="progress-fill" style="width: ${progress}%">
                        ${progress.toFixed(1)}%
                    </div>
                </div>

                ${info.destination_directory ? `
                    <div style="margin-top: 10px; font-size: 12px; color: #888;">
                        📁 ${info.destination_directory}
                    </div>
                ` : ''}
            `;

        if (info.finished && pollIntervals[uuid]) {
            clearInterval(pollIntervals[uuid]);
            delete pollIntervals[uuid];
        }
    };

    const pollDownload = async (uuid) => {
        const apiUrl = document.getElementById('apiUrl').value;

        try {
            const response = await fetch(`${apiUrl}/download/${uuid}`);
            const data = await response.json();

            downloads[uuid] = data;
            updateDownloadUI(uuid, data);
        } catch (error) {
            console.error(`Erreur lors du polling de ${uuid}:`, error);
        }
    };

    const startPolling = (uuid) => {
        const interval = parseInt(document.getElementById('pollInterval').value) * 1000;

        pollDownload(uuid);

        pollIntervals[uuid] = setInterval(() => {
            pollDownload(uuid);
        }, interval);
    };

    document.getElementById('downloadForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const apiUrl = document.getElementById('apiUrl').value;
        const typeDl = document.getElementById('typeDl').value;
        const urlsText = document.getElementById('urls').value.trim();
        const submitBtn = document.getElementById('submitBtn');

        if (!urlsText) {
            showMessage('Veuillez entrer au moins une URL', true);
            return;
        }

        const urls = urlsText.split('\n').filter(url => url.trim());

        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ Lancement...';

        try {
            const response = await fetch(`${apiUrl}/download`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    urls: urls,
                    type_dl: typeDl
                })
            });

            if (!response.ok) {
                throw new Error(`Erreur HTTP: ${response.status}`);
            }

            const data = await response.json();

            showMessage(`✅ ${data.uuids.length} téléchargement(s) lancé(s)`);

            data.uuids.forEach(uuid => {
                startPolling(uuid);
            });

            document.getElementById('urls').value = '';

        } catch (error) {
            showMessage(`❌ Erreur: ${error.message}`, true);
            console.error('Erreur:', error);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '🚀 Lancer le téléchargement';
        }
    });

    window.addEventListener('beforeunload', () => {
        Object.values(pollIntervals).forEach(interval => clearInterval(interval));
    });
</script>
</body>
</html>
