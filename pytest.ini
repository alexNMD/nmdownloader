[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    integration: integration tests
    slow: slow running tests
    unit: unit tests

[pytest-coverage]
; If you want coverage reports
; addopts = --cov=src --cov-report=term-missing
