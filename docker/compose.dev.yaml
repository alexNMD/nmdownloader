x-nmd-common: !reset null

services:
  redis:
    volumes: !reset []

# Have to set a correct token to be started
  discord:
    depends_on: !reset null
    image: nmdownloader
    build:
      context: ..
    command: "nmd-discord"
    env_file: !override
      - ../.env

  celery:
    depends_on: !reset null
    image: nmdownloader
    build:
      context: ..
    volumes:
      - /tmp:/media
    env_file: !override
      - ../.env

  flower:
    depends_on: !reset null
    image: nmdownloader
    build:
      context: ..
    env_file: !override
      - ../.env

  flask:
    depends_on: !reset null
    image: nmdownloader
    build:
      context: ..
    env_file: !override
      - ../.env
