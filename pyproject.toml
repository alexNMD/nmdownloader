[project]
name = "nmdownloader"
description = "Multi-interface download orchestrator with API, web UI, and Discord integration"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.6.2",
    "discord>=2.3.2",
    "ffmpeg-python>=0.2.0",
    "flask>=3.1.2",
    "flower>=2.0.1",
    "gunicorn>=23.0.0",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytubefix>=10.3.8",
    "requests>=2.32.4",
    "unzipall>=1.0.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.11",
    "types-requests>=2.32.4.20260107",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ty>=0.0.56",
]

[project.scripts]
nmd-worker = "nmdownloader.apps.celery_app.runners:worker"
nmd-flower = "nmdownloader.apps.celery_app.runners:flower"
nmd-flask = "nmdownloader.apps.flask_app.runners:gunicorn"
nmd-discord = "nmdownloader.apps.discord_app.runners:bot"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "N",
    "ANN",
    "PYI",
]
preview = true
ignore = ["ANN002", "ANN003"]
