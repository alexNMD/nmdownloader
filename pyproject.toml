[project]
name = "nmdownloader"
description = "Multi-interface download orchestrator with API, web UI, and Discord integration"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.6.2",
    "discord>=2.3.2",
    "ffmpeg-python>=0.2.0",
    "flask>=3.1.2",
    "flower>=2.0.1",
    "gunicorn>=23.0.0",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytubefix>=10.3.8",
    "requests>=2.32.4",
    "unzipall>=1.0.1",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "ruff>=0.14.11",
    "types-requests>=2.32.4.20260107",
    "celery-types>=0.24.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.mypy]
plugins = ['pydantic.mypy']
