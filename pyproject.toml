[project]
name = "nmdownloader"
description = "Multi-interface download orchestrator with API, web UI, and Discord integration"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6.2",
    "celery-types>=0.24.0",
    "discord>=2.3.2",
    "flask>=3.1.2",
    "flower>=2.0.1",
    "gunicorn>=23.0.0",
    "loguru>=0.7.3",
    "mypy>=1.19.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "requests>=2.32.5",
    "unzipall>=1.0.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.11",
]
