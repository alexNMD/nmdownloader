x-environment: &default-environment
  DISCORD_ADMINS: '["NMD#0000"]'
  DISCORD_TOKEN: dummy_token
  DISCORD_DEFAULT_CHANNEL_ID: dummy_channel_id
  DOWNLOAD_UN_FICHIER_TOKEN: dummy_1fichier_token

services:
  redis:
    image: redis:latest
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 3

# Have to set a correct token to be started
#  discord:
#    depends_on:
#      celery:
#        condition: service_healthy
#      redis:
#        condition: service_healthy
#    image: nmdownloader
#    build:
#      context: .
#    environment: *default-environment
#    command: ["python", "-m", "nmdownloader.apps.discord_app"]


  celery:
    depends_on:
      redis:
        condition: service_healthy
    image: nmdownloader
    build:
      context: .
    command: ["celery", "--app", "nmdownloader.apps.celery_app", "worker", "--loglevel=${NMD_LOG_LEVEL:-INFO}", "--events"]
    # have to be mounted (medias location)
    volumes:
     - /tmp:/media
    environment:
      <<: *default-environment
      C_FORCE_ROOT: "true"
    healthcheck:
      test: celery --app nmdownloader.apps.celery_app status
      interval: 10s
      timeout: 10s
      retries: 10

  flower:
    depends_on:
      celery:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: nmdownloader
    build:
      context: .
    environment:
      <<: *default-environment
      FLOWER_UNAUTHENTICATED_API: "true"
    ports:
      - "5555:5555"
    command: ["celery", "--app", "nmdownloader.apps.celery_app", "flower"]

  flask:
    depends_on:
      celery:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: nmdownloader
    build:
      context: .
    environment: *default-environment
    ports:
      - "8000:8000"
    command: ["gunicorn", "nmdownloader.apps.flask_app:flask_app"]
