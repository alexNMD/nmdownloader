name: Build & Push Multi-Arch Docker Image

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: nmdownloader

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  build:
    runs-on: ubuntu-latest
    needs: lint

    permissions:
      packages: write   # for ghcr.io push
      contents: write   # for GitHub release

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install uv and setup the python version
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set version
        run: uv version ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/alexnmd/${{ env.IMAGE_NAME }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            docker/compose.yaml
            example.env
