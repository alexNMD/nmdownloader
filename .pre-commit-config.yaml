repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        args: [".", "--install-types", "--non-interactive"]
        additional_dependencies:
          - types-requests
          - types-passlib
          - types-gunicorn
          - Flask
          - pydantic
